name: _debug-secrets
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      OSEG_CAPTURE_YOUTUBE: ${{ secrets.OSEG_CAPTURE_YOUTUBE }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
    steps:
      - name: probe (no values printed — presence + length only)
        run: |
          node -e '
            for (const x of ["OSEG_CAPTURE_YOUTUBE","YOUTUBE_API_KEY","DATAFORSEO_LOGIN","DATAFORSEO_PASSWORD"]) {
              const v = process.env[x];
              console.log(x, "present="+(v!=null && v!==""), "len="+((v||"").length), "trimmedLen="+((v||"").trim().length));
            }
            console.log("OSEG===1 ?", process.env.OSEG_CAPTURE_YOUTUBE==="1", "| OSEG.trim()===1 ?", (process.env.OSEG_CAPTURE_YOUTUBE||"").trim()==="1");
          '
