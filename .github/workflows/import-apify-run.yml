name: import-apify-run
run-name: "import-apify-run: ${{ inputs.slug }} (${{ inputs.platform }}) — requested by ${{ inputs.actorEmail }}"
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Workspace slug to import into'
        required: true
        type: string
      runId:
        description: 'Apify actor-run id whose dataset to import (its default dataset)'
        required: true
        type: string
      platform:
        description: 'apify platform: google | booking | expedia'
        required: true
        default: 'google'
        type: string
      actorEmail:
        description: 'Access-verified email of the requesting user'
        required: true
        type: string

concurrency:
  group: capture-${{ inputs.slug }}
  cancel-in-progress: false

env:
  ENGINE_REPO: Onstage-CEO/oseg-resort-audit
  ENGINE_REF: 52735023c79870e490802b51acc4e4113c3e159b

permissions:
  contents: write

jobs:
  import-apify-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate actor email
        env:
          ACTOR_EMAIL: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          case "$ACTOR_EMAIL" in
            joe@onstage.biz|michele@onstage.biz|ashley@onstage.biz) echo "actor ok" ;;
            *) echo "::error::actorEmail is not on the Access allowlist"; exit 1 ;;
          esac

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          path: data-repo

      - name: Resolve workspace dir from slug
        id: resolve
        env:
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IN_SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,99}$'; then
            echo "::error::invalid slug"; exit 1
          fi
          ws="$GITHUB_WORKSPACE/data-repo/data/clients/$IN_SLUG"
          if [ ! -f "$ws/audit.json" ]; then
            echo "::error::workspace not found: $IN_SLUG"; exit 1
          fi
          echo "ws=$ws" >> "$GITHUB_OUTPUT"

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: Onstage-CEO/oseg-resort-audit
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      - name: Import Apify run (zero new spend — reads an existing dataset)
        working-directory: engine
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          WS: ${{ steps.resolve.outputs.ws }}
          RUN_ID: ${{ inputs.runId }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          npx tsx src/cli/index.ts import-apify-run "$WS" --platform "$PLATFORM" --run-id "$RUN_ID" --json

      - name: Commit and push
        working-directory: data-repo
        env:
          IN_SLUG: ${{ inputs.slug }}
          ACTOR: ${{ inputs.actorEmail }}
          RUN_ID: ${{ inputs.runId }}
        run: |
          set -euo pipefail
          git add "data/clients/$IN_SLUG"
          if git diff --cached --quiet; then
            echo "Import produced no changes (already present?)."
            exit 0
          fi
          git config user.name "oseg-audit-console"
          git config user.email "$ACTOR"
          git commit -m "import-apify-run: $IN_SLUG <- run $RUN_ID — requested by $ACTOR"
          git pull --rebase origin main
          git push

  # GITHUB_TOKEN pushes don't fire the push trigger, so refresh verify/summary
  # explicitly (mirrors capture.yml) — the imported totals then show in the UI.
  status:
    needs: import-apify-run
    uses: ./.github/workflows/status.yml
    with:
      slug: ${{ inputs.slug }}
    secrets: inherit
    permissions:
      contents: write
