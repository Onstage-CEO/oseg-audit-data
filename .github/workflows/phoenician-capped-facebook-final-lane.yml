name: phoenician-capped-facebook-final-lane
on:
  push:
    branches: [main]
    paths:
      - 'data/clients/the-phoenician-resort-and-spa-rebuilt-2026-07-31/facebook-run-request.json'

permissions:
  contents: write

concurrency:
  group: phoenician-capped-facebook-final-lane
  cancel-in-progress: false

env:
  ENGINE_REPO: Onstage-CEO/oseg-resort-audit
  ENGINE_REF: 343cb629ab994bac5438b10ffc8d123982a66240
  SLUG: the-phoenician-resort-and-spa-rebuilt-2026-07-31

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout data
        uses: actions/checkout@v4
        with:
          path: data-repo
          fetch-depth: 0
      - name: Checkout reviewed engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install engine
        working-directory: engine
        run: npm ci
      - name: Capture exact Facebook page with provider-enforced ceiling
        working-directory: engine
        env:
          WS: ${{ github.workspace }}/data-repo/data/clients/${{ env.SLUG }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set -euo pipefail
          npm run dev --silent -- capture-facebook "$WS" \
            --approved-cost-usd 5 \
            --max-total-charge-usd 5 \
            --limit 30 \
            --approval-reference "User approved Phoenician total cap 30 USD; Facebook allocation capped at 5 USD"
          npm run dev --silent -- generate-coverage-matrix "$WS" --require-us-complete || true
      - name: Commit capture lineage
        working-directory: data-repo
        run: |
          set -euo pipefail
          git add "data/clients/$SLUG"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "oseg-audit-bot"
          git config user.email "actions@onstage.biz"
          git commit -m "capture capped Phoenician Facebook lane"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          exit 1
