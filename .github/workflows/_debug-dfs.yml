name: _debug-dfs
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
    steps:
      - name: explore locations + test location_code task_post
        run: |
          node -e '
            const login=(process.env.DATAFORSEO_LOGIN||"").trim(), pass=(process.env.DATAFORSEO_PASSWORD||"").trim();
            const auth="Basic "+Buffer.from(login+":"+pass).toString("base64");
            (async()=>{
              const lr=await fetch("https://api.dataforseo.com/v3/business_data/google/locations/US",{headers:{authorization:auth}});
              const lb=await lr.json();
              const items=(lb.tasks&&lb.tasks[0]&&lb.tasks[0].result)||[];
              console.log("US locations count:", items.length);
              const sc=items.filter(x=>/scottsdale/i.test(x.location_name||"")).slice(0,6)
                .map(x=>({code:x.location_code,name:x.location_name,type:x.location_type}));
              console.log("SCOTTSDALE_MATCHES="+JSON.stringify(sc));
              if(sc.length){
                const code=sc[0].code;
                const body=[{keyword:"Fairmont Scottsdale Princess",location_code:code,language_name:"English",depth:10,sort_by:"newest"}];
                const tr=await fetch("https://api.dataforseo.com/v3/business_data/google/reviews/task_post",{method:"POST",headers:{authorization:auth,"content-type":"application/json"},body:JSON.stringify(body)});
                const tb=await tr.json();
                const t=tb.tasks&&tb.tasks[0];
                console.log("TASKPOST_WITH_CODE http="+tr.status+" status_code="+(t&&t.status_code)+" msg="+JSON.stringify(t&&t.status_message)+" id="+(t&&t.id?"yes":"no"));
              }
            })().catch(e=>console.log("ERR",e.message));
          '
