# Entertainment Evidence Discovery (hosted)
#
# Builds the internal gold-nugget worklist: visual/social/forum/blog query packs
# plus explicit entertainment nuggets already found in captured reviews. This is
# operator intelligence only, not a client-facing claim surface.

name: entertainment-discovery
run-name: "entertainment-discovery: ${{ inputs.slug }} — requested by ${{ inputs.actorEmail }}"
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Workspace slug'
        required: true
        type: string
      actorEmail:
        description: 'Access-verified email of the requesting user'
        required: true
        type: string

concurrency:
  group: entertainment-discovery-${{ inputs.slug }}
  cancel-in-progress: false

env:
  ENGINE_REPO: Onstage-CEO/oseg-resort-audit
  ENGINE_REF: 7621026aac83613c53ccccf0db00476cf4583911

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate actor email
        env:
          ACTOR_EMAIL: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          case "$ACTOR_EMAIL" in
            joe@onstage.biz|michele@onstage.biz|ashley@onstage.biz) echo "actor ok" ;;
            *) echo "::error::actorEmail is not on the Access allowlist"; exit 1 ;;
          esac

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          path: data-repo
          fetch-depth: 0

      - name: Resolve workspace dir from slug
        id: resolve
        env:
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IN_SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,99}$'; then
            echo "::error::invalid slug"; exit 1
          fi
          ws="$GITHUB_WORKSPACE/data-repo/data/clients/$IN_SLUG"
          if [ ! -f "$ws/audit.json" ]; then
            echo "::error::workspace not found: $IN_SLUG"; exit 1
          fi
          echo "ws=$ws" >> "$GITHUB_OUTPUT"

      - name: Checkout engine (pinned, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      - name: Build entertainment discovery worklist
        working-directory: engine
        env:
          WS: ${{ steps.resolve.outputs.ws }}
        run: |
          set -euo pipefail
          npm run dev --silent -- entertainment-discovery "$WS" 2>/tmp/discovery.err || { cat /tmp/discovery.err >&2; exit 1; }
          cat /tmp/discovery.err >&2
          grep -E 'wrote entertainment-discovery' /tmp/discovery.err | tail -1 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit (attributed) and push
        working-directory: data-repo
        env:
          IN_SLUG: ${{ inputs.slug }}
          ACTOR: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          git add "data/clients/$IN_SLUG/entertainment-discovery.json" "data/clients/$IN_SLUG/entertainment-discovery.md"
          if git diff --cached --quiet; then
            echo "Entertainment discovery produced no changes — nothing committed."
            exit 0
          fi
          git config user.name "oseg-audit-bot"
          git config user.email "actions@onstage.biz"
          git commit -m "entertainment-discovery: $IN_SLUG — requested by $ACTOR"
          pushed=0
          for k in 1 2 3; do
            if git push; then pushed=1; break; fi
            git pull --rebase --autostash
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 3 attempts"; exit 1; }
