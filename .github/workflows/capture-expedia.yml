name: capture-expedia
run-name: "capture-expedia: ${{ inputs.slug }} — requested by ${{ inputs.actorEmail }}"
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Workspace slug to capture Expedia for'
        required: true
        type: string
      actorEmail:
        description: 'Access-verified email of the requesting user'
        required: true
        type: string

concurrency:
  group: capture-expedia-${{ inputs.slug }}
  cancel-in-progress: false

env:
  ENGINE_REPO: Onstage-CEO/oseg-resort-audit
  ENGINE_REF: e17f91b0a2f283524bc773d4c2dc8f611b145fb2

permissions:
  contents: write

jobs:
  capture-expedia:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Validate actor email
        env:
          ACTOR_EMAIL: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          case "$ACTOR_EMAIL" in
            joe@onstage.biz|michele@onstage.biz|ashley@onstage.biz) echo "actor ok" ;;
            *) echo "::error::actorEmail is not on the Access allowlist"; exit 1 ;;
          esac

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          path: data-repo

      - name: Resolve workspace dir from slug
        id: resolve
        env:
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IN_SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,99}$'; then
            echo "::error::invalid slug"; exit 1
          fi
          ws="$GITHUB_WORKSPACE/data-repo/data/clients/$IN_SLUG"
          if [ ! -f "$ws/audit.json" ]; then
            echo "::error::workspace not found: $IN_SLUG"; exit 1
          fi
          echo "ws=$ws" >> "$GITHUB_OUTPUT"

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: Onstage-CEO/oseg-resort-audit
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      - name: Capture Expedia only
        working-directory: engine
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OSEG_APIFY_MAX_WAIT_MS: ${{ vars.OSEG_APIFY_MAX_WAIT_MS || '3000000' }}
          OSEG_CAPTURE_DEPTH: ${{ vars.OSEG_CAPTURE_DEPTH || '4490' }}
          WS: ${{ steps.resolve.outputs.ws }}
        run: |
          set -euo pipefail
          cat > .tmp-capture-expedia.ts <<'TS'
          import { readFile } from 'node:fs/promises';
          import { expediaApifyAdapter } from './src/capture/apify-adapter.js';
          import { buildCaptureRunStatus, loadCaptureRunStatusIfPresent, persistCaptureRunStatus } from './src/capture/run-status.js';

          const ws = process.env.WS;
          if (!ws) throw new Error('WS is required');
          const audit = JSON.parse(await readFile(`${ws}/audit.json`, 'utf8'));
          const expediaUrl = audit.client?.expediaUrl;
          if (typeof expediaUrl !== 'string' || !expediaUrl) throw new Error('audit.client.expediaUrl is required');
          const now = new Date().toISOString();
          const target = {
            propertyName: String(audit.client.propertyName),
            location: String(audit.client.location),
            expediaUrl,
          };
          const requestedDepth = Math.trunc(Number(process.env.OSEG_CAPTURE_DEPTH || 200));
          const result = await expediaApifyAdapter.capture({
            workspaceDir: ws,
            target,
            queries: [],
            env: process.env,
            now,
            maxResults: Number.isFinite(requestedDepth) && requestedDepth > 0 ? requestedDepth : 200,
          });
          const captured = result.coverage?.capturedReviews ?? (result.recordsAdded + result.duplicatesSkipped);
          console.log(JSON.stringify(result, null, 2));
          if (result.status !== 'ok' || captured < 50) {
            throw new Error(`Expedia capture did not produce a credible review set: status=${result.status}, captured=${captured}`);
          }
          const prev = await loadCaptureRunStatusIfPresent(ws);
          const byPlatform = new Map((prev?.sources ?? []).map((s) => [s.platformId, s]));
          byPlatform.set('expedia', result);
          await persistCaptureRunStatus(
            ws,
            buildCaptureRunStatus({ generatedAt: now, property: target, sources: [...byPlatform.values()] }),
          );
          TS
          npx tsx .tmp-capture-expedia.ts
          rm .tmp-capture-expedia.ts

      - name: Commit and push
        working-directory: data-repo
        env:
          IN_SLUG: ${{ inputs.slug }}
          ACTOR: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          git add "data/clients/$IN_SLUG"
          if git diff --cached --quiet; then
            echo "Expedia capture produced no changes."
            exit 0
          fi
          git config user.name "oseg-audit-console"
          git config user.email "$ACTOR"
          git commit -m "capture-expedia: $IN_SLUG — requested by $ACTOR"
          git pull --rebase origin main
          git push
