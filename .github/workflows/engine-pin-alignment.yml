name: engine-pin-alignment

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/engine-release.json'
      - '.github/scripts/check-engine-pins.mjs'
      - '.github/scripts/check-engine-pins.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/engine-release.json'
      - '.github/scripts/check-engine-pins.mjs'
      - '.github/scripts/check-engine-pins.test.mjs'
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test the pin checker against drift fixtures
        run: node --test .github/scripts/check-engine-pins.test.mjs
      - name: Verify every engine workflow executes the approved release
        run: node .github/scripts/check-engine-pins.mjs
