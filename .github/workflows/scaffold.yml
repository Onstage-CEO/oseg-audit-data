# New Audit (Phase 2B.0, issue oseg-resort-audit#135)
#
# Dispatched by the audit-console-api Worker on behalf of an Access-
# authenticated user. Creates one audit workspace in ONE attributed commit —
# the black-box-recorder contract: no silent writes, actor email in history.
#
# Engine is pinned to a known-good SHA (bump deliberately, never 'main').

name: scaffold
on:
  workflow_dispatch:
    inputs:
      clientName:
        description: 'Client (organization) name'
        required: true
        type: string
      propertyName:
        description: 'Property name as guests know it'
        required: true
        type: string
      workspaceSlug:
        description: 'Optional unique workspace slug for a fresh rerun of an existing property'
        required: false
        type: string
        default: ''
      location:
        description: 'City/region, e.g. "Scottsdale, Arizona"'
        required: true
        type: string
      brand:
        description: 'Brand / ownership group (optional)'
        required: false
        type: string
        default: ''
      website:
        description: 'Property website URL (optional)'
        required: false
        type: string
        default: ''
      renovationDate:
        description: 'Renovation/reopening date YYYY-MM-DD (optional): report shows a pre/post split'
        required: false
        type: string
        default: ''
      dateFrom:
        description: 'Analyze only reviews on/after YYYY-MM-DD (optional)'
        required: false
        type: string
        default: ''
      dateTo:
        description: 'Analyze only reviews on/before YYYY-MM-DD (optional)'
        required: false
        type: string
        default: ''
      actorEmail:
        description: 'Access-verified email of the requesting user'
        required: true
        type: string

env:
  ENGINE_REPO: Onstage-CEO/oseg-resort-audit
  ENGINE_REF: 0a77d2b6a4ddfa43f3a48469ae8297585ebced94

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    # Repo-wide lock on the SCAFFOLD COMMIT ONLY (serializes commit+push, makes
    # same-slug races lose cleanly at the existing-directory check). This is at the
    # JOB level, not the workflow, so the lock releases after the ~60s scaffold —
    # NOT held for the full ~10-min capture→…→evidence chain below. Two different
    # resorts can therefore audit concurrently; only the scaffold commits serialize.
    concurrency:
      group: scaffold
      cancel-in-progress: false
    outputs:
      slug: ${{ steps.commit.outputs.slug }}
    steps:
      - name: Validate actor email
        env:
          ACTOR_EMAIL: ${{ inputs.actorEmail }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$ACTOR_EMAIL" in
            joe@onstage.biz|michele@onstage.biz|ashley@onstage.biz) echo "actor ok" ;;
            *) echo "::error::actorEmail is not on the Access allowlist"; exit 1 ;;
          esac
          # actorEmail is a self-attested dispatch INPUT: the case above proves only
          # that the caller typed an allowlisted string. github.actor is the identity
          # GitHub authenticates, so gate on that too.
          case "$GH_ACTOR" in
            Onstage-CEO|oseg-automation[bot]) echo "dispatching actor $GH_ACTOR permitted" ;;
            *) echo "::error::actor $GH_ACTOR is not permitted to dispatch this workflow"; exit 1 ;;
          esac

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          path: data-repo

      - name: Checkout engine (pinned, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      - name: Scaffold workspace
        working-directory: engine
        # Inputs reach the shell ONLY via env vars (quoted) — never inline
        # ${{ }} interpolation in run: — so quotes/backticks in a property
        # name cannot inject commands.
        env:
          IN_CLIENT: ${{ inputs.clientName }}
          IN_PROPERTY: ${{ inputs.propertyName }}
          IN_SLUG: ${{ inputs.workspaceSlug }}
          IN_LOCATION: ${{ inputs.location }}
          IN_BRAND: ${{ inputs.brand }}
          IN_WEBSITE: ${{ inputs.website }}
          IN_RENOVATION: ${{ inputs.renovationDate }}
          IN_DATE_FROM: ${{ inputs.dateFrom }}
          IN_DATE_TO: ${{ inputs.dateTo }}
        run: |
          set -euo pipefail
          args=(new-property --yes
            --client-name "$IN_CLIENT"
            --property "$IN_PROPERTY"
            --location "$IN_LOCATION"
            --root "$GITHUB_WORKSPACE/data-repo/data/clients"
            --registry config/source-registry.json)
          [ -n "$IN_SLUG" ] && args+=(--slug "$IN_SLUG")
          [ -n "$IN_BRAND" ] && args+=(--brand "$IN_BRAND")
          [ -n "$IN_WEBSITE" ] && args+=(--website "$IN_WEBSITE")
          [ -n "$IN_RENOVATION" ] && args+=(--renovation-date "$IN_RENOVATION")
          [ -n "$IN_DATE_FROM" ] && args+=(--date-from "$IN_DATE_FROM")
          [ -n "$IN_DATE_TO" ] && args+=(--date-to "$IN_DATE_TO")
          npm run dev -- "${args[@]}"

      - name: Record rebuilt-source preflight and fresh-run lineage
        working-directory: engine
        env:
          IN_PROPERTY: ${{ inputs.propertyName }}
          IN_SLUG: ${{ inputs.workspaceSlug }}
          IN_LOCATION: ${{ inputs.location }}
          IN_DATE_FROM: ${{ inputs.dateFrom }}
          IN_DATE_TO: ${{ inputs.dateTo }}
          ENGINE_SHA: ${{ env.ENGINE_REF }}
        run: |
          set -euo pipefail
          slug="$IN_SLUG"
          if [ -z "$slug" ]; then
            slug=$(printf '%s' "$IN_PROPERTY" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g;s/^-+|-+$//g')
          fi
          ws="$GITHUB_WORKSPACE/data-repo/data/clients/$slug"
          test -f "$ws/audit.json"
          npm run dev --silent -- source-preflight --output-dir "$ws/validation-preflight" --format markdown > /tmp/source-preflight.md
          node - "$ws" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const ws = process.argv[2];
          const manifest = {
            schemaVersion: 'V1',
            purpose: 'fresh_rebuilt_source_validation',
            propertyName: process.env.IN_PROPERTY,
            location: process.env.IN_LOCATION,
            workspaceSlug: path.basename(ws),
            engineSha: process.env.ENGINE_SHA,
            historicalWorkspaceImported: false,
            historicalConclusionsImported: false,
            analysisWindow: {
              from: process.env.IN_DATE_FROM || null,
              to: process.env.IN_DATE_TO || null,
            },
            createdAt: new Date().toISOString(),
          };
          fs.writeFileSync(path.join(ws, 'validation-run.json'), JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Commit (attributed) and push
        id: commit
        working-directory: data-repo
        env:
          ACTOR_EMAIL: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          git add data/clients
          if git diff --cached --quiet; then
            echo "::error::Scaffold produced no changes — likely a duplicate slug. Nothing committed."
            exit 1
          fi
          slug=$(git diff --cached --name-only | head -1 | sed -E 's|^data/clients/([^/]+)/.*|\1|')
          git config user.name "oseg-audit-bot"
          git config user.email "actions@onstage.biz"
          git commit -m "scaffold: ${slug} — requested by ${ACTOR_EMAIL}"
          git push
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "### Scaffolded \`${slug}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested by: ${ACTOR_EMAIL}" >> "$GITHUB_STEP_SUMMARY"

  # One button = the whole audit. Scaffolding alone left an EMPTY workspace that
  # silently waited for a manual "Run deep capture" click — the begin button that
  # didn't begin. New Audit now runs the FULL pipeline server-side, sequentially,
  # so the user comes back to a finished audit:
  #   scaffold → capture → brief → client report → entertainment evidence
  # Sequential (each `needs` the previous) so per-slug commits never race; each
  # reusable workflow refreshes verify (status.yml) where relevant. The standalone
  # /api/capture, /api/brief, … endpoints still work for re-running any one step.
  # Every job also `needs: scaffold` to read its slug output. A downstream failure
  # stops the chain but leaves every already-committed step intact.
  capture:
    needs: scaffold
    uses: ./.github/workflows/capture.yml
    with:
      slug: ${{ needs.scaffold.outputs.slug }}
      actorEmail: ${{ inputs.actorEmail }}
    secrets: inherit
    permissions:
      contents: write

  # brief / report / evidence run SEQUENTIALLY (each `needs` the previous) so their
  # per-slug commits never race — but their SUCCESS is decoupled: each gates only on
  # `capture` succeeding (the one real data dependency, the review corpus), via
  # `if: always() && needs.capture.result == 'success'`. So a missing ANTHROPIC_API_KEY
  # that fails the (LLM) report no longer also kills the deterministic evidence doc;
  # evidence still builds. `always()` lets a job run even when the PRIOR sibling failed,
  # while the capture gate keeps everything skipped if there is no corpus to work on.
  brief:
    needs: [scaffold, capture]
    if: ${{ needs.capture.result == 'success' }}
    uses: ./.github/workflows/generate-brief.yml
    with:
      slug: ${{ needs.scaffold.outputs.slug }}
      actorEmail: ${{ inputs.actorEmail }}
    secrets: inherit
    permissions:
      contents: write

  report:
    needs: [scaffold, capture, brief]
    if: ${{ always() && needs.capture.result == 'success' }}
    uses: ./.github/workflows/generate-client-report.yml
    with:
      slug: ${{ needs.scaffold.outputs.slug }}
      actorEmail: ${{ inputs.actorEmail }}
      # Renovation date drives the report's pre/post split + the post-reno case
      # examples; the analysis window (if any) is carried through too.
      splitDate: ${{ inputs.renovationDate }}
      dateFrom: ${{ inputs.dateFrom }}
      dateTo: ${{ inputs.dateTo }}
    secrets: inherit
    permissions:
      contents: write

  evidence:
    needs: [scaffold, capture, report]
    if: ${{ always() && needs.capture.result == 'success' }}
    uses: ./.github/workflows/generate-entertainment-evidence.yml
    with:
      slug: ${{ needs.scaffold.outputs.slug }}
      actorEmail: ${{ inputs.actorEmail }}
    secrets: inherit
    permissions:
      contents: write
