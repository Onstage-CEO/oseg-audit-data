# Generate CLIENT Report (hosted) — the paid deliverable
#
# Dispatched by the audit-console-api Worker on behalf of an Access-authenticated
# user. Runs the engine's generate-client-report for one workspace server-side
# over its captured review corpus and commits a CLIENT-FACING, on-brand
# client-report.html in ONE attributed commit.
#
# Unlike the internal Tier-B brief, this is the artifact a resort GM receives:
# numbers rendered deterministically, narrative written by the Anthropic Messages
# API (grounded, refuse-to-fabricate). It HARD-REQUIRES ANTHROPIC_API_KEY — a
# client document must never silently degrade — so this workflow FAILS if the key
# is absent or the model refuses/truncates.
#
# Engine is pinned to a known-good SHA (bump deliberately, never 'main').

name: generate-client-report
run-name: "client-report: ${{ inputs.slug }} — requested by ${{ inputs.actorEmail }}"
on:
  # Dispatched standalone by the Worker (/api/client-report) AND called as a
  # reusable step by scaffold.yml so one New Audit runs the whole pipeline.
  workflow_dispatch:
    inputs:
      slug:
        description: 'Workspace slug to build a client report for'
        required: true
        type: string
      actorEmail:
        description: 'Access-verified email of the requesting user'
        required: true
        type: string
      splitDate:
        description: 'Renovation/reopening date YYYY-MM-DD (optional): report shows a pre/post split'
        required: false
        type: string
        default: ''
      dateFrom:
        description: 'Analyze only reviews on/after YYYY-MM-DD (optional)'
        required: false
        type: string
        default: ''
      dateTo:
        description: 'Analyze only reviews on/before YYYY-MM-DD (optional)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      actorEmail:
        required: true
        type: string
      splitDate:
        required: false
        type: string
        default: ''
      dateFrom:
        required: false
        type: string
        default: ''
      dateTo:
        required: false
        type: string
        default: ''

concurrency:
  group: client-report-${{ inputs.slug }}
  cancel-in-progress: false

env:
  ENGINE_REPO: Onstage-CEO/oseg-resort-audit
  ENGINE_REF: dafafb5cfdbd4bd5c58f2b60fc2a134f763648c4

permissions:
  contents: write

jobs:
  client-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate actor email
        env:
          ACTOR_EMAIL: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          case "$ACTOR_EMAIL" in
            joe@onstage.biz|michele@onstage.biz|ashley@onstage.biz) echo "actor ok" ;;
            *) echo "::error::actorEmail is not on the Access allowlist"; exit 1 ;;
          esac

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          path: data-repo
          fetch-depth: 0
          # Branch tip (see capture.yml): chained workflow_call must see the workspace
          # scaffold.yml just committed, not the pre-scaffold triggering SHA.
          ref: ${{ github.ref_name }}

      - name: Resolve workspace dir from slug
        id: resolve
        env:
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IN_SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,99}$'; then
            echo "::error::invalid slug"; exit 1
          fi
          ws="$GITHUB_WORKSPACE/data-repo/data/clients/$IN_SLUG"
          if [ ! -f "$ws/audit.json" ]; then
            echo "::error::workspace not found: $IN_SLUG"; exit 1
          fi
          echo "ws=$ws" >> "$GITHUB_OUTPUT"

      - name: Apply date controls to audit.json (optional, persisted)
        if: ${{ inputs.splitDate != '' || inputs.dateFrom != '' || inputs.dateTo != '' }}
        env:
          WS: ${{ steps.resolve.outputs.ws }}
          IN_SPLIT: ${{ inputs.splitDate }}
          IN_FROM: ${{ inputs.dateFrom }}
          IN_TO: ${{ inputs.dateTo }}
        run: |
          set -euo pipefail
          for v in "$IN_SPLIT" "$IN_FROM" "$IN_TO"; do
            if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::date must be YYYY-MM-DD: $v"; exit 1
            fi
          done
          f="$WS/audit.json"
          tmp="$(mktemp)"
          jq --arg split "$IN_SPLIT" --arg from "$IN_FROM" --arg to "$IN_TO" '
            (if $split != "" then .client.renovationDate = $split else . end)
            | (if ($from != "" or $to != "")
               then .client.dateRange = ((if $from != "" then {from:$from} else {} end) + (if $to != "" then {to:$to} else {} end))
               else . end)
          ' "$f" > "$tmp" && mv "$tmp" "$f"
          echo "Applied date controls:"; jq '.client | {renovationDate, dateRange}' "$f"

      - name: Checkout engine (pinned, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      - name: Generate client report
        working-directory: engine
        # Secrets reach the engine ONLY via env (never inline ${{ }} in run:).
        # ANTHROPIC_API_KEY is REQUIRED — the command exits non-zero without it,
        # failing this job (no silent degrade for a client-facing document).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WS: ${{ steps.resolve.outputs.ws }}
          DATA_REPO: ${{ github.workspace }}/data-repo
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set on this repo — required for the client report"; exit 1
          fi
          # Deterministic label stamp from the corpus commit time (the prose still
          # varies run-to-run since it's model-authored — a re-run is real
          # re-generation, expected to commit).
          NOW=$(git -C "$DATA_REPO" log -1 --format=%cI -- "data/clients/$IN_SLUG/captures-raw" 2>/dev/null || true)
          if [ -n "$NOW" ]; then
            npm run dev --silent -- generate-client-report "$WS" --now "$NOW" 2>/tmp/cr.err || { cat /tmp/cr.err >&2; exit 1; }
          else
            npm run dev --silent -- generate-client-report "$WS" 2>/tmp/cr.err || { cat /tmp/cr.err >&2; exit 1; }
          fi
          cat /tmp/cr.err >&2
          grep -E 'wrote client-report' /tmp/cr.err | tail -1 | sed 's/^\[generate-client-report\] /client report: /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Surface report readiness (does NOT block the draft)
        working-directory: engine
        env:
          WS: ${{ steps.resolve.outputs.ws }}
        run: |
          set -euo pipefail
          # generate-client-report already computed + wrote report-readiness.json.
          # Re-run the standalone gate to print the lifecycle status into the run
          # summary. This is a DRAFT-generation job, so a red report is surfaced,
          # never failed here — the export path (future PDF/deploy step) is what
          # must call `readiness --require-client-ready` and refuse a non-ready report.
          npm run dev --silent -- readiness "$WS" --now "$(date -u +%FT%TZ)" --json > /tmp/readiness.json 2>/tmp/readiness.err || { cat /tmp/readiness.err >&2; }
          STATUS=$(jq -r '.status // "UNKNOWN"' /tmp/readiness.json 2>/dev/null || echo UNKNOWN)
          echo "### Report readiness: \`$STATUS\`" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.gates[] | "- " + (if .pass then "[PASS]" else (if .overriddenBy then "[OVERRIDE]" else "[FAIL]" end) end) + " " + .gateId + " — " + .detail' /tmp/readiness.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$STATUS" != "CLIENT_READY" ]; then
            echo "::warning::Report for ${{ inputs.slug }} is a DRAFT ($STATUS) — NOT client-ready and not eligible for export until the blocking gates pass or an explicit logged override is recorded."
          fi

      - name: Commit (attributed) and push
        working-directory: data-repo
        env:
          IN_SLUG: ${{ inputs.slug }}
          ACTOR: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          git add "data/clients/$IN_SLUG"
          if git diff --cached --quiet; then
            echo "Client report produced no changes — nothing committed."
            echo "### Client report \`$IN_SLUG\`: no change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "oseg-audit-bot"
          git config user.email "actions@onstage.biz"
          git commit -m "client-report: $IN_SLUG — requested by $ACTOR"
          pushed=0
          for k in 1 2 3; do
            if git push; then pushed=1; break; fi
            git pull --rebase --autostash
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 3 attempts"; exit 1; }
          echo "### Built client report for \`$IN_SLUG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested by: $ACTOR" >> "$GITHUB_STEP_SUMMARY"

  status:
    needs: client-report
    uses: ./.github/workflows/status.yml
    with:
      slug: ${{ inputs.slug }}
    secrets: inherit
    permissions:
      contents: write
