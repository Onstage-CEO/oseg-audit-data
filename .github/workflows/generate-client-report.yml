# Generate CLIENT Report (hosted) — the paid deliverable
#
# Dispatched by the audit-console-api Worker on behalf of an Access-authenticated
# user. Runs the engine's generate-client-report for one workspace server-side
# over its captured review corpus and commits a CLIENT-FACING, on-brand
# client-report.html in ONE attributed commit.
#
# Unlike the internal Tier-B brief, this is the artifact a resort GM receives:
# numbers rendered deterministically, narrative written by the Anthropic Messages
# API (grounded, refuse-to-fabricate). It HARD-REQUIRES ANTHROPIC_API_KEY — a
# client document must never silently degrade — so this workflow FAILS if the key
# is absent or the model refuses/truncates.
#
# Engine is pinned to a known-good SHA (bump deliberately, never 'main').

name: generate-client-report
run-name: "client-report: ${{ inputs.slug }} — requested by ${{ inputs.actorEmail }}"
on:
  # Dispatched standalone by the Worker (/api/client-report) AND called as a
  # reusable step by scaffold.yml so one New Audit runs the whole pipeline.
  workflow_dispatch:
    inputs:
      slug:
        description: 'Workspace slug to build a client report for'
        required: true
        type: string
      actorEmail:
        description: 'Access-verified email of the requesting user'
        required: true
        type: string
      publishMode:
        description: 'artifact_only = downloadable preview, NOTHING committed (use for editorial review). commit = write the canonical package.'
        required: false
        type: choice
        default: artifact_only
        options: [artifact_only, commit]
      splitDate:
        description: 'Renovation/reopening date YYYY-MM-DD (optional): report shows a pre/post split'
        required: false
        type: string
        default: ''
      dateFrom:
        description: 'Analyze only reviews on/after YYYY-MM-DD (optional)'
        required: false
        type: string
        default: ''
      dateTo:
        description: 'Analyze only reviews on/before YYYY-MM-DD (optional)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      publishMode:
        description: 'commit (default for internal callers, preserves existing behavior) or artifact_only'
        required: false
        type: string
        default: commit
      slug:
        required: true
        type: string
      actorEmail:
        required: true
        type: string
      splitDate:
        required: false
        type: string
        default: ''
      dateFrom:
        required: false
        type: string
        default: ''
      dateTo:
        required: false
        type: string
        default: ''

concurrency:
  group: client-report-${{ inputs.slug }}
  cancel-in-progress: false

env:
  ENGINE_REPO: Onstage-CEO/oseg-resort-audit
  ENGINE_REF: 5a516992b669feb7e186f80f9de49ee42490d809

permissions:
  contents: write

jobs:
  attestation-gate:
    uses: ./.github/workflows/phoenician-attestation-freeze-gate.yml
    with:
      targetSlug: ${{ inputs.slug }}
      operationMode: ${{ inputs.publishMode }}

  client-report:
    needs: attestation-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate actor email
        env:
          ACTOR_EMAIL: ${{ inputs.actorEmail }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$ACTOR_EMAIL" in
            joe@onstage.biz|michele@onstage.biz|ashley@onstage.biz) echo "actor ok" ;;
            *) echo "::error::actorEmail is not on the Access allowlist"; exit 1 ;;
          esac
          # actorEmail is a self-attested dispatch INPUT: the case above proves only
          # that the caller typed an allowlisted string. github.actor is the identity
          # GitHub authenticates, so gate on that too.
          case "$GH_ACTOR" in
            Onstage-CEO|oseg-automation[bot]) echo "dispatching actor $GH_ACTOR permitted" ;;
            *) echo "::error::actor $GH_ACTOR is not permitted to dispatch this workflow"; exit 1 ;;
          esac

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          path: data-repo
          fetch-depth: 0
          # Branch tip (see capture.yml): chained workflow_call must see the workspace
          # scaffold.yml just committed, not the pre-scaffold triggering SHA.
          ref: ${{ github.ref_name }}

      - name: Resolve workspace dir from slug
        id: resolve
        env:
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IN_SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,99}$'; then
            echo "::error::invalid slug"; exit 1
          fi
          ws="$GITHUB_WORKSPACE/data-repo/data/clients/$IN_SLUG"
          if [ ! -f "$ws/audit.json" ]; then
            echo "::error::workspace not found: $IN_SLUG"; exit 1
          fi
          echo "ws=$ws" >> "$GITHUB_OUTPUT"

      - name: Gate downstream regeneration on Phoenician attestation
        if: ${{ inputs.slug != 'the-phoenician-resort-and-spa-rebuilt-2026-07-31' && !(inputs.slug == 'caesars-republic-scottsdale-2026-08-04' && inputs.publishMode == 'artifact_only') }}
        env:
          PHOENICIAN_WS: ${{ github.workspace }}/data-repo/data/clients/the-phoenician-resort-and-spa-rebuilt-2026-07-31
        run: |
          set -euo pipefail
          readiness="$PHOENICIAN_WS/report-readiness.json"
          attestation="$PHOENICIAN_WS/human-editorial-attestation.json"
          report="$PHOENICIAN_WS/client-report.html"
          for file in "$readiness" "$attestation" "$report"; do
            if [ ! -f "$file" ]; then
              echo "::error::downstream regeneration is locked until The Phoenician is human-attested"; exit 1
            fi
          done
          if [ "$(jq -r '.status' "$readiness")" != "CLIENT_READY" ]; then
            echo "::error::downstream regeneration is locked: Phoenician readiness is not CLIENT_READY"; exit 1
          fi
          if [ "$(jq -r '.decision' "$attestation")" != "pass" ]; then
            echo "::error::downstream regeneration is locked: Phoenician attestation is not PASS"; exit 1
          fi
          report_sha="$(sha256sum "$report" | awk '{print $1}')"
          attested_sha="$(jq -r '.artifactSha256' "$attestation")"
          if [ "$report_sha" != "$attested_sha" ]; then
            echo "::error::downstream regeneration is locked: Phoenician attestation does not match client-report.html"; exit 1
          fi

      - name: Apply date controls to audit.json (optional, persisted)
        if: ${{ inputs.splitDate != '' || inputs.dateFrom != '' || inputs.dateTo != '' }}
        env:
          WS: ${{ steps.resolve.outputs.ws }}
          IN_SPLIT: ${{ inputs.splitDate }}
          IN_FROM: ${{ inputs.dateFrom }}
          IN_TO: ${{ inputs.dateTo }}
        run: |
          set -euo pipefail
          for v in "$IN_SPLIT" "$IN_FROM" "$IN_TO"; do
            if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::date must be YYYY-MM-DD: $v"; exit 1
            fi
          done
          f="$WS/audit.json"
          tmp="$(mktemp)"
          jq --arg split "$IN_SPLIT" --arg from "$IN_FROM" --arg to "$IN_TO" '
            (if $split != "" then .client.renovationDate = $split else . end)
            | (if ($from != "" or $to != "")
               then .client.dateRange = ((if $from != "" then {from:$from} else {} end) + (if $to != "" then {to:$to} else {} end))
               else . end)
          ' "$f" > "$tmp" && mv "$tmp" "$f"
          echo "Applied date controls:"; jq '.client | {renovationDate, dateRange}' "$f"

      - name: Checkout engine (pinned, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      # The report source-completion gate is fail-closed: every workspace must
      # carry a fresh, terminal source-coverage ledger before narrative
      # generation. Capture workflows persist the underlying attempt/status
      # evidence; build the generic matrix here so a new property cannot reach
      # report generation with an absent or stale coverage artifact.
      - name: Generate source coverage matrix
        working-directory: engine
        env:
          WS: ${{ steps.resolve.outputs.ws }}
        run: npm run dev --silent -- generate-coverage-matrix "$WS"

      - name: Generate client report
        working-directory: engine
        # Secrets reach the engine ONLY via env (never inline ${{ }} in run:).
        # ANTHROPIC_API_KEY is REQUIRED — the command exits non-zero without it,
        # failing this job (no silent degrade for a client-facing document).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WS: ${{ steps.resolve.outputs.ws }}
          DATA_REPO: ${{ github.workspace }}/data-repo
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set on this repo — required for the client report"; exit 1
          fi
          # Deterministic label stamp from the corpus commit time (the prose still
          # varies run-to-run since it's model-authored — a re-run is real
          # re-generation, expected to commit).
          NOW=$(git -C "$DATA_REPO" log -1 --format=%cI -- "data/clients/$IN_SLUG/captures-raw" 2>/dev/null || true)
          if [ -n "$NOW" ]; then
            npm run dev --silent -- generate-client-report "$WS" --now "$NOW" 2>/tmp/cr.err || { cat /tmp/cr.err >&2; exit 1; }
          else
            npm run dev --silent -- generate-client-report "$WS" 2>/tmp/cr.err || { cat /tmp/cr.err >&2; exit 1; }
          fi
          cat /tmp/cr.err >&2
          grep -E 'wrote client-report' /tmp/cr.err | tail -1 | sed 's/^\[generate-client-report\] /client report: /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Recompute preview funnel break-test from generated artifacts
        env:
          WS: ${{ steps.resolve.outputs.ws }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ws=process.env.WS;
          const html=fs.readFileSync(ws+'/client-report.html','utf8');
          const brief=fs.readFileSync(ws+'/audit-brief.md','utf8');
          const evidenceManifest=JSON.parse(fs.readFileSync(ws+'/client-report-evidence-manifest.json','utf8'));
          const freshVerification=JSON.parse(fs.readFileSync(ws+'/client-report-verification.json','utf8'));
          const classifierRules=fs.readFileSync(ws+'/classifier-rules-v1.md','utf8');
          const path=ws+'/analytical-break-test.json';
          const prior=fs.existsSync(path)?JSON.parse(fs.readFileSync(path,'utf8')):{schemaVersion:'V3',checks:[]};
          const value=(label)=>{
            const marker='<tr><td>'+label+'</td><td class="num">';
            const start=html.toLowerCase().indexOf(marker.toLowerCase());
            if(start<0) return null;
            const tail=html.slice(start+marker.length);
            const match=tail.match(/^([0-9,]+)</);
            return match?Number(match[1].replace(/,/g,'')):null;
          };
          const captured=value('Raw review records captured across all available dates');
          const duplicates=value('Duplicate captured copies consolidated');
          const distinct=value('Normalized distinct reviews');
          const dateEligible=value('Reviews inside the selected start/end dates');
          const broad=value('Broad Entertainment / atmosphere theme');
          const candidates=value('Reviews mentioning entertainment in some form');
          const inScope=value('Verified resort-operated entertainment');
          const excluded=value('Excluded private-event or unrelated noise');
          const ambiguous=value('Ambiguous and held for human review');
          const headlineDistinct=Number(((html.match(/<span class="ml">Reviews scored<\/span><span class="mv">[0-9,]+<\/span><span class="ms">[\s\S]*?of ([0-9,]+) distinct reviews<\/span>/i)||[])[1]||'').replace(/,/g,''))||null;
          const selectedWindow=evidenceManifest.analysisWindow||{};
          const outletQuotes=[...html.matchAll(/<blockquote class="strength" data-evidence-layer="outlet" data-review-date="([^"]+)">([\s\S]*?)<\/blockquote>/g)].map(match=>({date:match[1],html:match[2]}));
          const outletQuoteDatesInsideWindow=typeof selectedWindow.from==='string'&&typeof selectedWindow.to==='string'&&outletQuotes.every(quote=>/^\d{4}-\d{2}-\d{2}$/.test(quote.date)&&quote.date>=selectedWindow.from&&quote.date<=selectedWindow.to);
          const outletQuoteLinksValid=outletQuotes.every(quote=>/<a href="https?:\/\/[^"\s]+"[^>]*>view source<\/a>/i.test(quote.html));
          const sourceStatuses=new Map([...html.matchAll(/<tr data-source-id="([^"]+)">([\s\S]*?)<\/tr>/g)].map(match=>{
            const cells=[...match[2].matchAll(/<td(?: [^>]*)?>([\s\S]*?)<\/td>/g)].map(cell=>cell[1].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().toLowerCase().replace(/\s+/g,'_'));
            return [match[1],cells[1]||''];
          }));
          const openWebEvidence=[...html.matchAll(/<blockquote class="watch-item" data-evidence-layer="open-web"(?: data-source-id="([^"]+)")?>([\s\S]*?)<\/blockquote>/g)].map(match=>({sourceId:match[1]||null,html:match[2]}));
          const blockedSourceEvidenceAbsent=openWebEvidence.every(item=>!item.sourceId||sourceStatuses.get(item.sourceId)==='captured');
          const redditExcerptAbsent=openWebEvidence.every(item=>item.sourceId!=='reddit'&&!/reddit\.com/i.test(item.html));
          const leadSection=(brief.split('## OSEG leads')[1]||'').split('## Ambiguous')[0]||'';
          const renderedLeads=leadSection.split('\n> ').slice(1).length;
          const entertainmentMetric=(html.match(/<span class="ml">Entertainment<\/span><span class="mv(?: [^"]*)?">([\s\S]*?)<\/span>/i)||[])[1]||'';
          const funnelValues=[captured,duplicates,distinct,dateEligible,broad,candidates,inScope,excluded,ambiguous];
          const funnelValuesValid=funnelValues.every(value=>Number.isInteger(value)&&value>=0);
          const briefFunnelPattern=new RegExp(
            'Of '+candidates+' entertainment-mention reviews: \\*\\*'+inScope+' in OSEG scope\\*\\*[^\\n]+'+
            excluded+' excluded[^\\n]+'+ambiguous+' ambiguous',
            'i'
          );
          const ratingSuppressionValid=inScope<10
            ? entertainmentMetric==='Rating suppressed'&&html.includes(`${inScope} verified in-scope reviews &middot; minimum n=10`)&&!/sample too small for rating/i.test(html)
            : entertainmentMetric!=='Rating suppressed';
          const current=[
            ['funnel_values_are_nonnegative_integers',funnelValuesValid],
            ['funnel_duplicates_reconcile',captured-distinct===duplicates],
            ['funnel_stages_are_monotonic',captured>=distinct&&distinct>=dateEligible&&dateEligible>=broad&&broad>=candidates],
            ['funnel_partition_reconciles',inScope+excluded+ambiguous===candidates],
            ['headline_denominator_equals_normalized_distinct',headlineDistinct===distinct],
            ['outlet_quote_dates_inside_selected_window',outletQuoteDatesInsideWindow],
            ['outlet_quote_source_urls_valid',outletQuoteLinksValid],
            ['blocked_or_credential_source_evidence_absent',blockedSourceEvidenceAbsent],
            ['reddit_excerpt_absent_when_lane_not_captured',redditExcerptAbsent&&sourceStatuses.get('reddit')!=='captured'],
            ['fresh_client_report_verification_ready',freshVerification.status==='ready'&&Array.isArray(freshVerification.checks)&&freshVerification.checks.every(check=>check.pass===true)],
            ['brief_matches_generated_funnel',briefFunnelPattern.test(brief)],
            ['rendered_leads_equal_verified_count',renderedLeads===inScope],
            ['classifier_rules_file_exists_and_versioned',classifierRules.includes('**Rule-set ID:** `entertainment-classifier-rules-v1`')&&classifierRules.includes('**Version:** `V1`')&&classifierRules.includes(`**Report-generation engine reference reviewed:** \`${process.env.ENGINE_REF}\``)&&/V1 answers a narrow question/i.test(classifierRules)],
            ['thin_entertainment_rating_suppressed',ratingSuppressionValid],
          ].map(([id,pass])=>({id,pass}));
          const replaced=new Set(current.map(c=>c.id));
          const obsolete=/^funnel_|^current_window_count$|^semantic_classifier$|^rendered_leads_equal_in_scope$/;
          const checks=[...(prior.checks||[]).filter(c=>!obsolete.test(c.id)&&!replaced.has(c.id)),...current];
          const failed=checks.filter(c=>!c.pass);
          const evidenceFunnel={
            captured,
            duplicateCopies:duplicates,
            normalizedDistinct:distinct,
            dateEligible,
            broadTheme:broad,
            entertainmentCandidates:candidates,
            inScope,
            excluded,
            ambiguous
          };
          fs.writeFileSync(path,JSON.stringify({...prior,evidenceFunnel,generatedAt:new Date().toISOString(),checks,total:checks.length,passed:checks.length-failed.length,allPass:failed.length===0},null,2)+'\n');
          if(failed.length) {
            console.error('Generated preview break-test failed:',failed.map(c=>c.id).join(', '));
            process.exit(1);
          }
          console.log('Generated preview funnel break-test passed:',current.length+'/'+current.length);
          NODE

      - name: Surface report readiness (does NOT block the draft)
        working-directory: engine
        env:
          WS: ${{ steps.resolve.outputs.ws }}
        run: |
          set -euo pipefail
          # generate-client-report already computed + wrote report-readiness.json.
          # Re-run the standalone gate to print the lifecycle status into the run
          # summary. This is a DRAFT-generation job, so a red report is surfaced,
          # never failed here — the export path (future PDF/deploy step) is what
          # must call `readiness --require-client-ready` and refuse a non-ready report.
          npm run dev --silent -- readiness "$WS" --now "$(date -u +%FT%TZ)" --json > /tmp/readiness.json 2>/tmp/readiness.err || { cat /tmp/readiness.err >&2; }
          STATUS=$(jq -r '.status // "UNKNOWN"' /tmp/readiness.json 2>/dev/null || echo UNKNOWN)
          echo "### Report readiness: \`$STATUS\`" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.gates[] | "- " + (if .pass then "[PASS]" else (if .overriddenBy then "[OVERRIDE]" else "[FAIL]" end) end) + " " + .gateId + " — " + .detail' /tmp/readiness.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$STATUS" != "CLIENT_READY" ]; then
            echo "::warning::Report for ${{ inputs.slug }} is a DRAFT ($STATUS) — NOT client-ready and not eligible for export until the blocking gates pass or an explicit logged override is recorded."
          fi

      # PREVIEW-SAFE PATH. A regenerated package must be reviewable BEFORE it can
      # replace the canonical one. artifact_only uploads the generated files as a
      # downloadable workflow artifact and commits nothing, so an editorial gate
      # can run against the real output without overwriting a client deliverable.
      - name: Upload preview artifact (no commit)
        if: ${{ inputs.publishMode != 'commit' }}
        uses: actions/upload-artifact@v4
        with:
          name: client-report-preview-${{ inputs.slug }}
          if-no-files-found: error
          retention-days: 14
          path: |
            data-repo/data/clients/${{ inputs.slug }}/client-report.html
            data-repo/data/clients/${{ inputs.slug }}/audit-brief.md
            data-repo/data/clients/${{ inputs.slug }}/analytical-break-test.json
            data-repo/data/clients/${{ inputs.slug }}/client-report-evidence-manifest.json
            data-repo/data/clients/${{ inputs.slug }}/client-report-verification.json
            data-repo/data/clients/${{ inputs.slug }}/report-readiness.json
            data-repo/data/clients/${{ inputs.slug }}/classifier-rules-v1.md
            data-repo/data/clients/${{ inputs.slug }}/source-coverage-matrix.json

      - name: Record preview provenance
        if: ${{ inputs.publishMode != 'commit' }}
        working-directory: data-repo
        env:
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          echo "### PREVIEW ONLY — nothing committed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| artifact | sha256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in client-report.html audit-brief.md analytical-break-test.json; do
            t="data/clients/$IN_SLUG/$f"
            [ -f "$t" ] && echo "| $f | $(sha256sum "$t" | cut -d' ' -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical package untouched. Human editorial review required before publishMode=commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit (attributed) and push
        if: ${{ inputs.publishMode == 'commit' }}
        working-directory: data-repo
        env:
          IN_SLUG: ${{ inputs.slug }}
          ACTOR: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          git add "data/clients/$IN_SLUG"
          if git diff --cached --quiet; then
            echo "Client report produced no changes — nothing committed."
            echo "### Client report \`$IN_SLUG\`: no change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "oseg-audit-bot"
          git config user.email "actions@onstage.biz"
          git commit -m "client-report: $IN_SLUG — requested by $ACTOR"
          pushed=0
          for k in 1 2 3; do
            if git push; then pushed=1; break; fi
            git pull --rebase --autostash
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 3 attempts"; exit 1; }
          echo "### Built client report for \`$IN_SLUG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested by: $ACTOR" >> "$GITHUB_STEP_SUMMARY"

  status:
    needs: client-report
    if: ${{ inputs.publishMode == 'commit' }}
    uses: ./.github/workflows/status.yml
    with:
      slug: ${{ inputs.slug }}
    secrets: inherit
    permissions:
      contents: write
