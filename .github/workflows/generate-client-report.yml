# Generate CLIENT Report (hosted) — the paid deliverable
#
# Dispatched by the audit-console-api Worker on behalf of an Access-authenticated
# user. Runs the engine's generate-client-report for one workspace server-side
# over its captured review corpus and commits a CLIENT-FACING, on-brand
# client-report.html in ONE attributed commit.
#
# Unlike the internal Tier-B brief, this is the artifact a resort GM receives:
# numbers rendered deterministically, narrative written by the Anthropic Messages
# API (grounded, refuse-to-fabricate). It HARD-REQUIRES ANTHROPIC_API_KEY — a
# client document must never silently degrade — so this workflow FAILS if the key
# is absent or the model refuses/truncates.
#
# Engine is pinned to a known-good SHA (bump deliberately, never 'main').

name: generate-client-report
run-name: "client-report: ${{ inputs.slug }} — requested by ${{ inputs.actorEmail }}"
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Workspace slug to build a client report for'
        required: true
        type: string
      actorEmail:
        description: 'Access-verified email of the requesting user'
        required: true
        type: string

concurrency:
  group: client-report-${{ inputs.slug }}
  cancel-in-progress: false

env:
  ENGINE_REPO: Onstage-CEO/oseg-resort-audit
  ENGINE_REF: c716f227256807364b80b0c8589dc7df7b6c9eea

permissions:
  contents: write

jobs:
  client-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate actor email
        run: |
          set -euo pipefail
          case "${{ inputs.actorEmail }}" in
            joe@onstage.biz|michele@onstage.biz|ashley@onstage.biz) echo "actor ok" ;;
            *) echo "::error::actorEmail is not on the Access allowlist"; exit 1 ;;
          esac

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          path: data-repo
          fetch-depth: 0

      - name: Resolve workspace dir from slug
        id: resolve
        env:
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IN_SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,99}$'; then
            echo "::error::invalid slug"; exit 1
          fi
          ws="$GITHUB_WORKSPACE/data-repo/data/clients/$IN_SLUG"
          if [ ! -f "$ws/audit.json" ]; then
            echo "::error::workspace not found: $IN_SLUG"; exit 1
          fi
          echo "ws=$ws" >> "$GITHUB_OUTPUT"

      - name: Checkout engine (pinned, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      - name: Generate client report
        working-directory: engine
        # Secrets reach the engine ONLY via env (never inline ${{ }} in run:).
        # ANTHROPIC_API_KEY is REQUIRED — the command exits non-zero without it,
        # failing this job (no silent degrade for a client-facing document).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WS: ${{ steps.resolve.outputs.ws }}
          DATA_REPO: ${{ github.workspace }}/data-repo
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set on this repo — required for the client report"; exit 1
          fi
          # Deterministic label stamp from the corpus commit time (the prose still
          # varies run-to-run since it's model-authored — a re-run is real
          # re-generation, expected to commit).
          NOW=$(git -C "$DATA_REPO" log -1 --format=%cI -- "data/clients/$IN_SLUG/captures-raw" 2>/dev/null || true)
          if [ -n "$NOW" ]; then
            npm run dev --silent -- generate-client-report "$WS" --now "$NOW" 2>/tmp/cr.err || { cat /tmp/cr.err >&2; exit 1; }
          else
            npm run dev --silent -- generate-client-report "$WS" 2>/tmp/cr.err || { cat /tmp/cr.err >&2; exit 1; }
          fi
          cat /tmp/cr.err >&2
          grep -E 'wrote client-report' /tmp/cr.err | tail -1 | sed 's/^\[generate-client-report\] /client report: /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit (attributed) and push
        working-directory: data-repo
        env:
          IN_SLUG: ${{ inputs.slug }}
          ACTOR: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          git add "data/clients/$IN_SLUG"
          if git diff --cached --quiet; then
            echo "Client report produced no changes — nothing committed."
            echo "### Client report \`$IN_SLUG\`: no change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "oseg-audit-bot"
          git config user.email "actions@onstage.biz"
          git commit -m "client-report: $IN_SLUG — requested by $ACTOR"
          pushed=0
          for k in 1 2 3; do
            if git push; then pushed=1; break; fi
            git pull --rebase --autostash
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 3 attempts"; exit 1; }
          echo "### Built client report for \`$IN_SLUG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested by: $ACTOR" >> "$GITHUB_STEP_SUMMARY"

  status:
    needs: client-report
    uses: ./.github/workflows/status.yml
    with:
      slug: ${{ inputs.slug }}
    secrets: inherit
    permissions:
      contents: write
