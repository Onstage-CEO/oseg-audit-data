# Web-discovery CAPTURE (Moat Phase 2) — automated open-web entertainment search.
#
# Runs the discovery worklist's TEXT lanes (forums, blogs/guides, complaint sites,
# competitors) through the DataForSEO Google-organic SERP server-side and commits
# sourced findings (web-discovery-evidence.json + .md). Open-web evidence only,
# never blended into the captured-review numbers. Engine pinned (bump deliberately).

name: capture-web-discovery
run-name: "web-discovery: ${{ inputs.slug }} — requested by ${{ inputs.actorEmail }}"
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Workspace slug'
        required: true
        type: string
      actorEmail:
        description: 'Access-verified email of the requesting user'
        required: true
        type: string

concurrency:
  group: web-discovery-${{ inputs.slug }}
  cancel-in-progress: false

env:
  ENGINE_REPO: Onstage-CEO/oseg-resort-audit
  ENGINE_REF: 0a77d2b6a4ddfa43f3a48469ae8297585ebced94

permissions:
  contents: write

jobs:
  web-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate actor email
        env:
          ACTOR_EMAIL: ${{ inputs.actorEmail }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$ACTOR_EMAIL" in
            joe@onstage.biz|michele@onstage.biz|ashley@onstage.biz) echo "actor ok" ;;
            *) echo "::error::actorEmail is not on the Access allowlist"; exit 1 ;;
          esac
          # actorEmail is a self-attested dispatch INPUT: the case above proves only
          # that the caller typed an allowlisted string. github.actor is the identity
          # GitHub authenticates, so gate on that too.
          case "$GH_ACTOR" in
            Onstage-CEO|oseg-automation[bot]) echo "dispatching actor $GH_ACTOR permitted" ;;
            *) echo "::error::actor $GH_ACTOR is not permitted to dispatch this workflow"; exit 1 ;;
          esac

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          path: data-repo
          fetch-depth: 0

      - name: Resolve workspace dir from slug
        id: resolve
        env:
          IN_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IN_SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]{0,99}$'; then
            echo "::error::invalid slug"; exit 1
          fi
          ws="$GITHUB_WORKSPACE/data-repo/data/clients/$IN_SLUG"
          if [ ! -f "$ws/audit.json" ]; then
            echo "::error::workspace not found: $IN_SLUG"; exit 1
          fi
          echo "ws=$ws" >> "$GITHUB_OUTPUT"

      - name: Checkout engine (pinned, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      - name: Run web-discovery capture
        working-directory: engine
        # Secrets reach the engine ONLY via env (never inline ${{ }} in run:).
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          WS: ${{ steps.resolve.outputs.ws }}
        run: |
          set -euo pipefail
          if [ -z "${DATAFORSEO_LOGIN:-}" ] || [ -z "${DATAFORSEO_PASSWORD:-}" ]; then
            echo "::error::DataForSEO creds not set on this repo"; exit 1
          fi
          npm run dev --silent -- capture-web-discovery "$WS" 2>/tmp/wd.err || { cat /tmp/wd.err >&2; exit 1; }
          cat /tmp/wd.err >&2
          grep -E 'capture-web-discovery' /tmp/wd.err | tail -1 | sed 's/^\[capture-web-discovery\] /web discovery: /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit (attributed) and push
        working-directory: data-repo
        env:
          IN_SLUG: ${{ inputs.slug }}
          ACTOR: ${{ inputs.actorEmail }}
        run: |
          set -euo pipefail
          git add "data/clients/$IN_SLUG"
          if git diff --cached --quiet; then
            echo "Web discovery produced no changes — nothing committed."
            echo "### Web discovery \`$IN_SLUG\`: no change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "oseg-audit-bot"
          git config user.email "actions@onstage.biz"
          git commit -m "web-discovery: $IN_SLUG — requested by $ACTOR"
          pushed=0
          for k in 1 2 3; do
            if git push; then pushed=1; break; fi
            git pull --rebase --autostash
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 3 attempts"; exit 1; }
          echo "### Web discovery for \`$IN_SLUG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested by: $ACTOR" >> "$GITHUB_STEP_SUMMARY"
